name: 📊 Actividad de Desarrollo

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generar tarjeta de actividad
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}

          user: manuel15963
          filename: assets/metrics.svg
          template: classic

          # Solo actividad real: sin seguidores, estrellas ni calendario verde
          base: activity

          config_timezone: America/Lima
          config_display: columns
          config_animations: yes

          repositories_affiliations: owner

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: percentage
          plugin_languages_colors: "0:#3B82F6, 1:#8B5CF6, 2:#A855F7, 3:#60A5FA, 4:#818CF8, 5:#C084FC, 6:#6366F1, 7:#A78BFA"
