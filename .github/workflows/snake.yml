name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manuel15963
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            assets/github-snake.svg?color_snake=%2300E5FF
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%238B5CF6

      - name: Save snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          git commit -m "Update contribution snake" || exit 0

          git push
