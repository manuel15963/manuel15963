name: 📊 Lenguajes

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=manuel15963&layout=compact&langs_count=8&hide_border=true&card_width=480&size_weight=0.5&count_weight=0.5&title_color=A78BFA&text_color=C9D1D9&bg_color=0D1117
          path: assets/lenguajes.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lenguajes.svg
          git commit -m "chore: actualizar tarjeta de lenguajes" || exit 0
          git pull --rebase --autostash
          git push
