name: 📈 Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=manuel15963&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&show=reviews,prs_merged&title_color=A78BFA&icon_color=60A5FA&text_color=C9D1D9&bg_color=0D1117&ring_color=8B5CF6
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=manuel15963&layout=compact&langs_count=8&hide_border=true&card_width=450&size_weight=0.5&count_weight=0.5&title_color=A78BFA&text_color=C9D1D9&bg_color=0D1117
          path: profile/languages.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats" || exit 0
          git pull --rebase --autostash
          git push
