name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=manuel15963&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&show=reviews,discussions_started,discussions_answered,prs_merged
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=manuel15963&layout=compact&langs_count=20&theme=tokyonight&hide_border=true&card_width=450&size_weight=0.5&count_weight=0.5
          path: profile/languages.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile statistics" || exit 0
          git push
